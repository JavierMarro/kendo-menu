name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject tracked private configuration and data files
        shell: bash
        run: |
          blocked=0
          while IFS= read -r -d '' tracked_path; do
            case "$tracked_path" in
              .env.example|*/.env.example) continue ;;
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|*.p12|*.pfx|*.sqlite|*.sqlite3|*.db|*.dump|*.backup|.vercel/*|*/.vercel/*|backups/*|*/backups/*|dumps/*|*/dumps/*)
                blocked=1 ;;
            esac
          done < <(git ls-files -z)
          if (( blocked )); then
            printf '%s\n' 'Remove tracked private configuration, key, database or backup files. Only .env.example templates are allowed.'
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          package-manager-cache: false

      - name: Enable packageManager-pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @kendo-menu/web exec playwright install --with-deps chromium

      - name: Run checks and complete release gate
        run: pnpm verify:full

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
